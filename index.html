<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Interactive MTG Card Builder</title>
  </head>
  <body>
    <h1>MTG Card Customizer</h1>

    <div class="input-group" style="margin-bottom: 15px">
      <label
        for="card-image-url"
        style="display: block; font-weight: bold; margin-bottom: 5px"
      >
        Artwork Image URL (Optional):
      </label>
      <input
        type="url"
        id="card-image-url"
        placeholder="https://example.com"
        style="
          width: 100%;
          padding: 8px;
          border-radius: 4px;
          border: 1px solid #ccc;
          box-sizing: border-box;
        "
      />
    </div>

    <div class="app-layout">
      <!-- Our Editor Panel -->
      <div class="editor">
        <h3>Edit Card Text Below:</h3>
        <textarea id="card-input-text">
Black Lotus {0}
Artifact
{T}, Sacrifice Black Lotus: Add three mana of any one color.
Flavor Text: "The lotus blooms, an ephemeral beauty harboring infinite power."
Rarity: Mythic Rare</textarea
        >
        <button id="generate-btn">Generate Custom Card</button>
      </div>

      <!-- Our Visual Output Display -->
      <div id="card-container">Click button to generate...</div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
