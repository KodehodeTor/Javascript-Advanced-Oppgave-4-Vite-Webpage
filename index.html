<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Interactive MTG Card Builder</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        background: #1e1e1e;
        color: #fff;
        padding: 20px;
      }
      .app-layout {
        display: flex;
        gap: 40px;
        flex-wrap: wrap;
        margin-top: 20px;
      }
      .editor {
        display: flex;
        flex-direction: column;
        gap: 15px;
        width: 450px;
      }
      textarea {
        width: 100%;
        height: 250px;
        background: #2d2d2d;
        color: #fff;
        border: 1px solid #444;
        border-radius: 8px;
        padding: 12px;
        font-family: monospace;
        font-size: 14px;
      }
      button {
        background: #ff4d4d;
        color: white;
        border: none;
        padding: 12px;
        font-weight: bold;
        border-radius: 6px;
        cursor: pointer;
        font-size: 16px;
      }
      button:hover {
        background: #ff3333;
      }
      #card-container {
        min-width: 420px;
        min-height: 590px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #111;
        border-radius: 18px;
        border: 2px dashed #333;
      }
    </style>
  </head>
  <body>
    <h1>MTG Card Customizer</h1>

    <div class="app-layout">
      <!-- Our Editor Panel -->
      <div class="editor">
        <h3>Edit Card Text Below:</h3>
        <textarea id="card-input-text">
Black Lotus {0}
Artifact
{T}, Sacrifice Black Lotus: Add three mana of any one color.
Flavor Text: "The lotus blooms, an ephemeral beauty harboring infinite power."
Rarity: Mythic Rare</textarea
        >
        <button id="generate-btn">Generate Custom Card</button>
      </div>

      <div class="input-group" style="margin-bottom: 15px">
        <label
          for="card-image-url"
          style="display: block; font-weight: bold; margin-bottom: 5px"
        >
          Artwork Image URL (Optional):
        </label>
        <input
          type="url"
          id="card-image-url"
          placeholder="https://example.com"
          style="
            width: 100%;
            padding: 8px;
            border-radius: 4px;
            border: 1px solid #ccc;
            box-sizing: border-box;
          "
        />
      </div>

      <!-- Our Visual Output Display -->
      <div id="card-container">Click button to generate...</div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
